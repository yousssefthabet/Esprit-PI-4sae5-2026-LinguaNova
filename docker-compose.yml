services:
  mysql:
    image: mysql:8.4
    container_name: linguanova-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: PI
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka:
    build:
      context: ./backend/microservices/Eureka-Server
    container_name: linguanova-eureka
    ports:
      - "${EUREKA_PORT:-8762}:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || wget -qO- http://localhost:8761/"]
      interval: 20s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: ./backend/microservices/user-service
    container_name: linguanova-user-service
    ports:
      - "${USER_SERVICE_PORT:-8182}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/PI?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started

  course-service:
    build:
      context: ./backend/microservices/courss-service
    container_name: linguanova-course-service
    ports:
      - "${COURSE_SERVICE_PORT:-8181}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/PI?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started

  event-service:
    build:
      context: ./backend/microservices/event-service
    container_name: linguanova-event-service
    ports:
      - "${EVENT_SERVICE_PORT:-8185}:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/PI?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started

  examen-service:
    build:
      context: ./backend/microservices/examen-service
    container_name: linguanova-examen-service
    ports:
      - "${EXAMEN_SERVICE_PORT:-8186}:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/PI?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      USER_SERVICE_URL: http://user-service:8082
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
      user-service:
        condition: service_started

  note-service:
    build:
      context: ./backend/microservices/note-service
    container_name: linguanova-note-service
    ports:
      - "${NOTE_SERVICE_PORT:-8189}:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/PI?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      USER_SERVICE_URL: http://user-service:8082
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
      user-service:
        condition: service_started

  api-gateway:
    build:
      context: ./backend/microservices/API_Gateway
    container_name: linguanova-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8193}:8093"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    depends_on:
      eureka:
        condition: service_started

  frontend:
    build:
      context: ./LinguaNova
    container_name: linguanova-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      user-service:
        condition: service_started
      course-service:
        condition: service_started
      event-service:
        condition: service_started
      examen-service:
        condition: service_started
      note-service:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: linguanova-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: linguanova-cadvisor
    ports:
      - "${CADVISOR_PORT:-8198}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  grafana:
    image: grafana/grafana:11.4.0
    container_name: linguanova-grafana
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  mysql_data:
  grafana_data:
