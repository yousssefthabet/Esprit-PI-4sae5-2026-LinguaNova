<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>LinguaNova — Apprentissage de l'anglais, accessible à tous</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LinguaNova : plateforme e-learning d'apprentissage de l'anglais, conçue pour l'accessibilité (lecteurs d'écran, navigation clavier).">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function() {
      var t = localStorage.getItem('linguanova-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      else document.documentElement.setAttribute('data-theme', window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
